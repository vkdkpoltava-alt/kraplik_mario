<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101219">
<title>Краплик · Сигнал порятунку</title>
<style>
  *{box-sizing:border-box}
  :root{color-scheme:dark;--paper:#fff4e8;--muted:#bcb1c4;--red:#ff716e;--line:#403349;--zone:#ffa09b}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#452338 0%,transparent 45%),radial-gradient(ellipse at 90% 85%,#18283e 0%,transparent 44%),#110f1c;color:var(--paper);font:15px/1.5 system-ui,sans-serif}
  main{width:min(100% - 28px,1080px);margin:clamp(12px,4vh,48px) auto}
  header,.readout,footer,.controls,.stations{display:flex;align-items:center;justify-content:space-between;gap:10px}
  header{margin-bottom:15px;align-items:end}
  .header-actions{display:flex;gap:8px;align-items:center}
  #pause[hidden]{display:none}
  .identity{display:flex;align-items:center;gap:12px}
  .mark{width:38px;height:38px;flex:none;background:var(--red);clip-path:polygon(39% 0,61% 0,61% 28%,85% 28%,85% 42%,100% 42%,100% 82%,85% 82%,85% 100%,15% 100%,15% 82%,0 82%,0 42%,15% 42%,15% 28%,39% 28%);display:grid;place-items:center;color:#231629;font:bold 26px monospace}
  h1,h2,p{margin:0}
  h1{font-size:clamp(21px,4vw,41px);letter-spacing:-.055em;line-height:1}
  .eyebrow,.readout,.stations,footer{font-family:"Courier New",monospace}
  .eyebrow{color:var(--red);font-size:11px;font-weight:bold;letter-spacing:.11em;text-transform:uppercase}
  .cabinet{border:1px solid var(--line);background:#191523;box-shadow:0 6px #0c0a14,0 18px 54px #08061199}
  .readout{padding:10px 14px;color:var(--zone);font-size:13px}
  .meters{display:flex;align-items:center;gap:16px}
  #hearts{color:#ff8181;letter-spacing:2px;white-space:nowrap}
  #cells{color:#ffe58a;white-space:nowrap}
  .screen{position:relative;background:#17172a;border-block:1px solid var(--line);isolation:isolate;overflow:hidden}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
  .overlay{position:absolute;inset:0;display:grid;align-items:center;background:linear-gradient(90deg,#100b1ae8 0%,#100b1ac2 40%,#100b1a18 77%);padding:clamp(12px,4vw,44px)}
  .overlay[hidden]{display:none}
  .card{border-left:3px solid var(--zone);padding:clamp(7px,1.7vw,18px);width:min(55%,490px)}
  .card .eyebrow{color:var(--zone)}
  h2{font-size:clamp(23px,5.3vw,61px);line-height:1;letter-spacing:-.06em;margin:5px 0 12px;text-wrap:balance}
  .card p:not(.eyebrow){color:#f0dde0;font-size:clamp(12px,2.4vw,16px);margin-bottom:16px;max-width:34ch}
  button{font:700 13px "Courier New",monospace;color:var(--paper);background:#242032;border:1px solid #604d64;padding:8px 11px;cursor:pointer;touch-action:none;user-select:none}
  button:hover{background:#41334a}
  button:focus-visible{outline:2px solid #ffe58a;outline-offset:3px}
  #action{background:var(--zone);color:#211427;border:0;box-shadow:3px 3px #5e354c;padding:11px 16px}
  #action:hover{filter:brightness(1.14)}
  .stations{display:grid;grid-template-columns:repeat(3,1fr);padding:0;gap:0;font-size:12px;color:var(--muted)}
  .stations span{border-top:3px solid #4a3c4f;padding:8px 12px}
  .stations span+span{border-left:1px solid var(--line)}
  .stations .current{color:var(--paper);border-top-color:var(--zone);background:#ffffff08}
  .stations .done{border-top-color:#87d1a4;color:#a7dfb8}
  footer{padding-top:15px;flex-wrap:wrap;color:var(--muted);font-size:12px}
  .controls{display:none;margin-top:12px;gap:6px;touch-action:none}
  .controls button{min-width:50px;min-height:45px;font-size:18px}
  .controls button:last-child{margin-left:auto}
  .controls button.held{background:#774352}
  #rotate-hint{display:none}
  body.immersive-active{overflow:hidden;overscroll-behavior:none}
  main.immersive{
    position:fixed;inset:0;z-index:1000;width:100%;max-width:none;margin:0;
    height:100vh;height:var(--viewport-height,100dvh);overflow:hidden;
    padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    background:#110f1c;touch-action:none;
  }
  .immersive::backdrop{background:#110f1c}
  .immersive header{position:absolute;top:max(6px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:4;margin:0}
  .immersive .identity,.immersive #restart,.immersive .stations,.immersive footer{display:none}
  .immersive .header-actions{gap:6px}
  .immersive .header-actions button{min-height:32px;padding:6px 9px;font-size:12px}
  .immersive .cabinet{height:100%;border:0;box-shadow:none;background:transparent;display:grid;grid-template-rows:32px minmax(0,1fr)}
  .immersive .readout{padding:0 200px 0 4px;font-size:12px;min-width:0;gap:8px}
  .immersive .screen,.immersive .screen:has(.overlay:not([hidden])){
    min-height:0;width:min(100%,calc(var(--screen-height,70vh)*1.777778));height:auto;
    aspect-ratio:16/9;align-self:center;justify-self:center;border:0;
  }
  .immersive .screen canvas,.immersive .screen:has(.overlay:not([hidden])) canvas{width:100%;height:100%;object-fit:contain}
  .immersive .overlay{padding:clamp(10px,3vw,30px)}
  .immersive h2{font-size:clamp(24px,6vh,45px)}
  .immersive .card p:not(.eyebrow){font-size:clamp(12px,3vh,16px)}
  .immersive .controls{
    display:flex;position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
    bottom:max(12px,env(safe-area-inset-bottom));margin:0;gap:10px;pointer-events:none;
  }
  .immersive .controls button{pointer-events:auto;min-width:58px;min-height:58px;padding:10px;background:#282035dc;border:2px solid #9b7c95;font-size:20px;border-radius:8px}
  .immersive .controls button:last-child{min-width:88px;font-size:16px}
  .immersive .controls button.held{background:#784557}
  .immersive:has(.overlay:not([hidden])) .controls{visibility:hidden}
  @media(orientation:portrait){
    .immersive .readout{padding:40px 4px 0;height:70px}
    .immersive .cabinet{grid-template-rows:70px minmax(0,1fr)}
    .immersive #rotate-hint{display:block;position:absolute;top:calc(max(6px,env(safe-area-inset-top)) + 82px);left:12px;right:12px;text-align:center;font-size:13px;color:var(--zone);pointer-events:none}
  }
  @media(pointer:coarse),(max-width:680px){.controls{display:flex}.keyboard{display:none}}
  @media(max-width:590px){header{align-items:center;flex-wrap:wrap}.header-actions{margin-left:auto}.mark{width:29px;height:29px;font-size:19px}.readout{font-size:11px}.meters{gap:8px}.stations span{padding:6px;font-size:10px}.card{width:min(74%,350px)}.card .eyebrow{display:none}.card p:not(.eyebrow){margin-bottom:7px}h2{margin:0 0 5px}#action{padding:7px 9px}}
  @media(max-width:380px){.screen:has(.overlay:not([hidden])){min-height:187px}.screen:has(.overlay:not([hidden])) canvas{height:187px;object-fit:cover}.card{width:84%}}
</style>
<main id="game-shell">
  <header>
    <div class="identity"><div class="mark" aria-hidden="true">+</div><div><p class="eyebrow">Станція переливання крові</p><h1>Сигнал порятунку</h1></div></div>
    <div class="header-actions">
      <button id="restart" type="button" title="Почати новий маршрут">Нова гра</button>
      <button id="pause" type="button" hidden>Пауза</button>
      <button id="fullscreen" type="button" aria-controls="game-shell" aria-pressed="false">⛶ На весь екран</button>
    </div>
  </header>
  <div class="cabinet">
    <div class="readout"><strong id="sector"></strong><div class="meters"><span id="hearts" aria-label="Запас енергії"></span><span id="cells" aria-label="Запобіжники"></span></div></div>
    <div class="screen">
      <canvas id="game" width="384" height="216" aria-label="Піксельний платформер про Краплика"></canvas>
      <div class="overlay" id="overlay">
        <div class="card"><p class="eyebrow" id="overline"></p><h2 id="headline"></h2><p id="message"></p><button id="action" type="button"></button></div>
      </div>
    </div>
    <nav class="stations" aria-label="Зони станції">
      <span>01 Реєстратура</span><span>02 Лабораторія</span><span>03 Холодовий блок</span>
    </nav>
  </div>
  <div class="controls" aria-label="Сенсорне керування"><button type="button" data-key="left" aria-label="Ліворуч">◀</button><button type="button" data-key="right" aria-label="Праворуч">▶</button><button type="button" data-key="jump">↑ Стрибок</button></div>
  <p id="rotate-hint" role="status">Поверни смартфон горизонтально ↻</p>
  <footer><span class="keyboard">← → або A / D · рух &nbsp; / &nbsp; Пробіл · стрибок &nbsp; / &nbsp; Esc · пауза</span><span id="route"></span></footer>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const stages = [
  { name:"Реєстратура", note:"Роботи-прибиральники й візки перегородили прохід. Стрибай їм на корпус згори.",
    wall:"#452e43", light:"#634453", tile:"#91505b", top:"#eca59a", accent:"#ffb39e", low:"#211829", ink:"#170f23" },
  { name:"Лабораторія", note:"Дрони пікірують, коли спалахує червоне око. Жовті пружини перекидають через широкі провалля.",
    wall:"#204550", light:"#32626a", tile:"#3d7a79", top:"#8cdbbd", accent:"#a5f5c9", low:"#122a37", ink:"#0c1b2a" },
  { name:"Холодовий блок", note:"Крижані кульки розганяються ривками. Не затримуйся на потрісканій підлозі.",
    wall:"#2c385f", light:"#435580", tile:"#526c9d", top:"#b0ddfb", accent:"#b4dfff", low:"#18243f", ink:"#111a32" }
];
const keys = new Map([
  ["ArrowLeft","left"],["KeyA","left"],["ArrowRight","right"],["KeyD","right"],
  ["Space","jump"],["ArrowUp","jump"],["KeyW","jump"]
]);
const held = new Set(), touches = new Map();
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
const enemySizes = {cart:[20,11], cleaner:[18,13], drone:[18,12], frost:[15,14]};
let seed, stageIndex, level, player, mode, time, camera, energy, collected, checkpoint;
let jumpBuffer = 0, coyote = 0, invulnerable = 0, promptTimer = 0, particles = [], visualTime = 0;

function randomFor(value) {
  return () => {
    value = (Math.imul(1664525, value) + 1013904223) >>> 0;
    return value / 4294967296;
  };
}

function generate(routeSeed, zone) {
  const random = randomFor((routeSeed ^ Math.imul(zone + 1, 0x9e3779b1)) >>> 0);
  const integer = (min, max) => min + Math.floor(random() * (max - min + 1));
  const platforms = [{x:0,y:173,base:173,w:148,type:"floor"}];
  const vents = [], enemies = [], fuses = [], kits = [];
  const count = 12;
  const launchAt = [3+integer(0,1),7+integer(0,1),10];
  for (let i = 1; i <= count; i++) {
    const prev = platforms.at(-1);
    const boosted = zone===1 && launchAt.includes(i);
    const gap = boosted ? integer(116,132) : integer(26,zone===0 ? 48 : 52);
    const x = prev.x + prev.w + gap;
    const y = clamp(prev.base + (boosted ? integer(-27,9) : integer(-23,24)), 117, 181);
    const w = i === count ? 164 : integer(75,122);
    const type = zone!==2 ? "floor" : [2,5,8,11].includes(i) ? "lift" : [3,7,10].includes(i) ? "ice" : "floor";
    const platform = {x,y,base:y,w,type,phase:random()*6.28,crack:0,rebuild:0};
    platforms.push(platform);
    if (boosted) {
      prev.spring = {x:prev.x+prev.w-22, direction:1};
      platform.spring = {x:platform.x+18, direction:-1};
    }
    if (zone === 0 && [2,4,7,10,11].includes(i)) {
      enemies.push({kind:"cart",platform,phase:random()*6.28,stopped:0,travel:0});
    }
    if (zone === 1 && !boosted && [2,5,6,9,11].includes(i)) {
      vents.push({x:x-gap/2,top:Math.min(y, prev.base)-14,phase:random()*2.9});
    }
    if ([3,6,9].includes(i)) fuses.push({platform,offset:integer(25,w-35),taken:false});
    if ((zone===1 && [5,10].includes(i)) || (zone===2 && [4,9].includes(i))) {
      kits.push({platform,offset:integer(24,w-30),taken:false});
    }
  }
  platforms[4].save = true;
  platforms[8].save = true;
  const kind = ["cleaner","drone","frost"][zone];
  const locations = [[1,5,9],[1,5,11],[1,6,9]][zone];
  for (const i of locations) {
    enemies.push({kind,platform:platforms[i],phase:random()*6.28,stopped:0,travel:0});
  }
  const end = platforms.at(-1);
  return {platforms, vents, enemies, fuses, kits, end, width:end.x+end.w, door:end.x+end.w-43};
}

function spawn() {
  player = {x:checkpoint.x+14,y:checkpoint.y-18,w:14,h:18,vy:0,dir:1,ground:checkpoint,boost:false};
  jumpBuffer = coyote = 0;
  camera = clamp(player.x-100,0,level.width-W);
}

function hud() {
  document.documentElement.style.setProperty("--zone",stages[stageIndex].accent);
  $("sector").textContent = `0${stageIndex+1} / ${stages[stageIndex].name}`;
  $("hearts").textContent = "♥".repeat(energy) + "♡".repeat(3-energy);
  $("cells").textContent = `◆ ${collected}/3`;
  $("route").textContent = `Маршрут ${seed.toString(16).toUpperCase().padStart(8,"0")}`;
  document.querySelectorAll(".stations span").forEach((span,i) => {
    span.classList.toggle("current",i===stageIndex);
    span.classList.toggle("done",i<stageIndex || mode==="won");
  });
}

function modal(state, tag, title, copy, label, next) {
  mode = state;
  $("pause").textContent = state==="pause" ? "Продовжити" : "Пауза";
  $("pause").disabled = state!=="pause";
  $("overline").textContent = tag;
  $("headline").textContent = title;
  $("message").textContent = copy;
  $("action").textContent = label;
  $("action").onclick = next;
  $("overlay").hidden = false;
}

function play() {
  mode = "play";
  $("pause").textContent = "Пауза";
  $("pause").disabled = false;
  $("overlay").hidden = true;
  $("action").blur();
}

function loadStage(index) {
  stageIndex = index;
  level = generate(seed, index);
  checkpoint = level.platforms[0];
  time = collected = invulnerable = promptTimer = 0;
  particles = [];
  energy = 3;
  spawn();
  hud();
  if (index === 0) {
    modal("intro","Аварійний виклик","Краплинка зачинена!",
      "Збери запобіжники в трьох зонах і відчини двері до Краплинки. Ворогів можна знешкодити стрибком згори.",
      "Почати порятунок",play);
  } else {
    modal("brief",`Зона 0${index+1} / 03`,stages[index].name,stages[index].note,"Уперед",play);
  }
}

function newGame() {
  seed = crypto.getRandomValues(new Uint32Array(1))[0];
  held.clear();
  loadStage(0);
}

function down(key) {
  return held.has(key) || [...touches.values()].some(touch=>touch.key===key);
}

function overlaps(a,x,y,w,h) {
  return a.x+a.w>x && a.x<x+w && a.y+a.h>y && a.y<y+h;
}

function burst(x,y,color,count=12) {
  for (let i=0;i<count;i++) {
    particles.push({x,y,vx:(Math.random()-.5)*105,vy:-20-Math.random()*75,life:.35+Math.random()*.4,color});
  }
}

function hit() {
  if (invulnerable>0) return;
  burst(player.x+7, player.y+9, "#ff7386");
  energy--;
  hud();
  if (energy===0) {
    modal("lost","Енергія вичерпана","Потрібна ще спроба",
      "Повтори цю зону. Платформи та запобіжники будуть на тих самих місцях.",
      "Повторити зону",()=>{loadStage(stageIndex);play();});
  } else {
    spawn();
    invulnerable = 1.25;
  }
}

const ventTime = vent => (time+vent.phase)%2.9;
const ventOn = vent => ventTime(vent)>1.94;

function enemyPose(enemy) {
  const {kind, platform, travel, phase} = enemy;
  const [w,h] = enemySizes[kind];
  const angle = travel*(kind==="cleaner"?3.25:2.25)+phase;
  let u = .5+.5*Math.sin(angle);
  let clearance = 0;
  let warning = false;
  if (kind==="drone") {
    const cycle = (travel+phase)%3.15;
    warning = cycle>=1.26 && cycle<2.52;
    const dive = Math.sin(Math.PI*clamp((cycle-1.68)/.9,0,1))**2;
    clearance = 22+Math.sin(angle)*2-dive*21;
  } else if (kind==="frost") {
    const cycle = ((travel+phase)%2.6)/2.6;
    const leg = (cycle%0.5)*2;
    const slide = clamp((leg-.37)/.63,0,1);
    u = cycle<.5 ? slide : 1-slide;
    warning = leg<.37;
  }
  const margin = kind==="cart" ? 10 : 24;
  const x = platform.x+margin+(platform.w-2*margin-w)*u;
  return {x,y:platform.y-h-clearance,w,h,warning};
}

function step(dt) {
  if (mode!=="play") return;
  time += dt;
  invulnerable = Math.max(0,invulnerable-dt);
  promptTimer = Math.max(0,promptTimer-dt);
  const p = player;
  const oldGround = p.ground;
  for (const platform of level.platforms) {
    const y = platform.base+(platform.type==="lift" ? Math.round(Math.sin(time*2.25+platform.phase)*14) : 0);
    if (platform===oldGround) p.y += y-platform.y;
    platform.y = y;
    if (platform.rebuild>0) {
      platform.rebuild = Math.max(0,platform.rebuild-dt);
    } else if (platform.type==="ice" && (platform===oldGround || platform.crack>0)) {
      platform.crack += dt;
      if (platform.crack>=.88) {
        platform.rebuild = 2.6;
        platform.crack = 0;
        burst(platform.x+platform.w/2,platform.y,"#b4e3ff",18);
      }
    }
  }
  for (const enemy of level.enemies) {
    if (enemy.stopped>0) enemy.stopped = Math.max(0,enemy.stopped-dt);
    else if (!enemy.defeated) enemy.travel += dt;
  }
  const move = Number(down("right"))-Number(down("left"));
  if (move) p.dir = move;
  p.x = clamp(p.x+move*(p.boost ? 220 : 152)*dt,2,level.width-p.w-2);
  const supported = oldGround && !oldGround.rebuild && p.x+p.w>oldGround.x && p.x<oldGround.x+oldGround.w;
  coyote = supported ? .085 : Math.max(0,coyote-dt);
  jumpBuffer = Math.max(0,jumpBuffer-dt);
  const pad = supported && oldGround.spring;
  const spring = pad && move===pad.direction && Math.abs(p.x+p.w/2-(pad.x+6))<=13;
  if (spring || (jumpBuffer && coyote)) {
    p.vy = spring ? -395 : -316;
    p.boost = Boolean(spring);
    coyote = jumpBuffer = 0;
    burst(p.x+7,p.y+18,spring ? "#ffe495" : stages[stageIndex].top,spring ? 14 : 6);
  }
  const oldBottom = p.y+p.h;
  p.vy += 850*dt;
  p.y += p.vy*dt;
  p.ground = null;
  if (p.vy >= 0) {
    for (const platform of level.platforms) {
      if (!platform.rebuild && p.x+p.w>platform.x && p.x<platform.x+platform.w && oldBottom<=platform.y+2 &&
        p.y+p.h>=platform.y) {
        p.y = platform.y-p.h;
        p.vy = 0;
        p.boost = false;
        p.ground = platform;
        if (platform.save && platform!==checkpoint && platform.x>checkpoint.x) {
          checkpoint = platform;
          burst(platform.x+9,platform.y-15,"#a3ffcb");
        }
        break;
      }
    }
  }
  if (p.y>H+8) {
    if (invulnerable) spawn();
    else hit();
    return;
  }
  for (const enemy of level.enemies) {
    if (enemy.defeated || enemy.stopped) continue;
    const {x,y,w,h} = enemyPose(enemy);
    if (!overlaps(p,x,y,w,h)) continue;
    if (oldBottom<=y+2 && p.vy>=0) {
      if (enemy.kind==="cart") enemy.stopped = 4.5;
      else enemy.defeated = true;
      p.y = y-p.h;
      p.vy = -252;
      p.ground = null;
      burst(x+w/2,y,stages[stageIndex].accent);
    } else if (!invulnerable) {
      hit();
      return;
    }
  }
  if (!invulnerable && level.vents.some(vent=>ventOn(vent)&&overlaps(p,vent.x-5,vent.top,10,H-vent.top))) {
    hit();
    return;
  }
  for (const fuse of level.fuses) {
    const x = fuse.platform.x+fuse.offset, y = fuse.platform.y-21;
    if (!fuse.taken && overlaps(p,x-8,y-5,16,22)) {
      fuse.taken = true;
      collected++;
      burst(x,y,"#ffe58a");
      hud();
    }
  }
  for (const kit of level.kits) {
    const x = kit.platform.x+kit.offset, y = kit.platform.y-14;
    if (!kit.taken && energy<3 && overlaps(p,x-7,y-5,14,14)) {
      kit.taken = true;
      energy++;
      burst(x,y,"#91f2b1");
      hud();
    }
  }
  if (p.ground===level.end && p.x+p.w>=level.door-5) {
    if (collected<3) promptTimer = 2;
    else if (stageIndex<2) {loadStage(stageIndex+1);return;}
    else {
      mode = "won";
      hud();
      modal("won","Зв’язок відновлено","Краплинку врятовано!",
        "Краплик повернув світло на станцію. Усі три зони знову працюють, а друзі нарешті разом.",
        "Новий маршрут",newGame);
    }
  }
  camera += (clamp(p.x-112,0,level.width-W)-camera)*Math.min(1,dt*9);
  for (const spark of particles) {
    spark.x += spark.vx*dt;
    spark.y += spark.vy*dt;
    spark.vy += 230*dt;
    spark.life -= dt;
  }
  particles = particles.filter(spark=>spark.life>0);
}

function box(color,x,y,w,h) {
  ctx.fillStyle = color;

function label(str,x,y,color="#f6e7d5",size=8) {

function sprite(x,y,dir,girl=false,pose="idle") {
  const ink = girl ? "#32182e" : "#2d1529";
  const dark = girl ? "#9d315d" : "#93283f";
  const mid = girl ? "#e65387" : "#e44b55";
  const light = girl ? "#ff89a6" : "#ff7770";
  const shine = girl ? "#ffd0ce" : "#ffd2af";
  const blink = (visualTime+(girl?1.7:0))%4.3>4.16;
  const stride = pose==="run" ? Math.floor(time*15)%2 : 0;
  const airborne = pose==="jump";
  ctx.save();
  ctx.translate(Math.round(x)+(dir<0?18:-4),Math.round(y)-6);
  ctx.scale(dir,1);
  // Stagger the silhouette by whole pixels to give each drop a distinct curl.
  const outline = girl ? [[10,1,5,2],[7,3,8,2],[5,5,12,3]] : [[7,0,4,2],[6,2,6,2],[5,4,10,4]];
  for (const [sx,sy,w,h] of outline) box(ink,sx,sy,w,h);
  box(ink,3,8,16,3);
  box(ink,1,11,20,8);
  box(ink,2,19,18,2);
  box(ink,5,21,12,1);
  box(dark,3,11,17,8);
  box(dark,5,19,12,2);
  box(mid,4,9,14,10);
  box(mid,6,6,9,5);
  box(mid,girl?9:7,girl?4:2,girl?5:4,4);
  box(light,6,8,8,3);
  box(light,4,11,11,5);
  box(light,6,16,8,2);
  box(shine,7,6,3,2);
  box(shine,5,10,2,3);
  box("#b73d58",15,17,4,1);

  // The near eye has a separate highlight so the face reads in motion.
  if (blink) {
    box(ink,12,13,4,1);
    box(ink,18,13,2,1);
  } else {
    box("#fff7e5",11,11,5,5);
    box("#fff7e5",17,12,3,4);
    box(ink,14,12,2,4);
    box(ink,19,13,1,3);
    box("#ffdfcd",14,12,1,1);
  }
  box(girl?"#ffb4bc":"#ffa38d",9,16,2,1);
  box(ink,15,17,2,1);
  box("#ffb7a1",16,18,2,1);

  const gloveY = airborne ? 15 : pose==="wave" ? 11 : 17+stride;
  if (girl) {
    box("#7b3355",3,6,9,4);
    box("#ffce71",3,6,3,3);
    box("#ffed9c",9,6,3,3);
    box("#fff2be",6,7,3,2);
    box("#286b66",4,19,12,2);
    box("#8de6c2",5,18,10,2);
    box("#479b8b",4,20,3,3);
    box(ink,1,gloveY,4,3);
    box("#ffe5cb",2,gloveY,2,2);
  } else {
    box("#4f2e4a",0,14,5,6);
    box("#85627b",1,14,3,3);
    box("#ffca8b",5,14,1,5);
    box("#f3bd86",7,15,4,3);
    box("#fff2cc",8,16,2,1);
    box(ink,2,gloveY,4,3);
    box("#ffe6c5",3,gloveY,2,2);
  }
  const heel = airborne ? 21 : 22;
  box(ink,3+stride,heel-stride,6,2);
  box(ink,13-stride,heel-(1-stride),6,2);
  box(girl?"#b8f4d7":"#ffdcad",4+stride,heel-stride,4,1);
  box(girl?"#b8f4d7":"#ffdcad",14-stride,heel-(1-stride),4,1);
  ctx.restore();
}

  const {x,y,w,type,crack,rebuild,spring,save} = platform;

    for (const rail of [x+11,x+w-13]) {
      box(s.ink,rail,46,4,173);
      for (let rung=49;rung<H;rung+=8) box(s.light,rail+1,rung,2,4);
    }
  } else if (type==="floor") {
    box(s.ink,x+6,y+11,7,H-y-11);
    box(s.ink,x+w-13,y+11,7,H-y-11);
    box(s.tile,x+8,y+15,2,H-y-15);
    box(s.tile,x+w-11,y+15,2,H-y-15);
  }
  if (rebuild) {
    for (let part=x+2;part<x+w;part+=9) box(s.light,part,y,4,1);
    return;
  }
  box(s.ink,x-1,y+1,w+2,15);
  box(type==="ice"?"#7091bf":s.tile,x,y+3,w,11);
  box(type==="ice"?"#d7f3fc":s.top,x,y,w,3);
  for(let tile=x+4;tile<x+w-5;tile+=12) {

    if (type==="ice") box("#97bdda",tile+2,y+8,3,(tile%4)+2);
    else box(s.low,tile+3,y+11,2,2);

  if (type==="lift") {
    box("#12192f",x+w/2-8,y+3,16,8);
    box("#a1e1ee",x+w/2-4,y+6,8,2);
  }
  if (crack) {

    box(s.ink,x+7,y-22,3,22);
    box(active?"#97e4ba":s.light,x+10,y-22,11,7);
    box(active?"#d4ffe2":s.tile,x+10,y-22,8,2);
  }
}

function render() {
  const s = stages[stageIndex];
  backdrop(s);
  if (mode==="intro" || mode==="won") {
    heroScene(s,mode==="won");
    return;
  }
  ctx.save();
  ctx.translate(-Math.round(camera),0);
  for (const platform of level.platforms) {
    const {x,w} = platform;
    if (x+w<camera-5 || x>camera+W+5) continue;
    floorTile(s,platform);
  }
  for (const vent of level.vents) {
    box(s.ink,vent.x-12,201,24,10);
    box(s.top,vent.x-9,201,18,3);
    for(let slit=-8;slit<9;slit+=4) box(s.tile,vent.x+slit,205,2,4);
    if (ventOn(vent)) {
      for (let j=0;j<10;j++) {
        const y = 203-(j*13+time*73)%(207-vent.top);
        const x = vent.x+Math.round(Math.sin(j*3+time*13)*5);
        box(j%2 ? "#b9fff1" : "#63aaab",x-4,y,8,4);
        box("#65bdb3",x-2,y+4,5,3);
      }
    } else if (ventTime(vent)>1.5) {
      box("#ffe58a",vent.x-3,vent.top+3,6,2);
      box("#ffe58a",vent.x-2,vent.top-5,3,5);
    }
  }
  for (const enemy of level.enemies) if (!enemy.defeated) drawEnemy(enemy);
  for (const {platform,offset,taken} of level.fuses) {
    if (taken) continue;
    const x=platform.x+offset, y=platform.y-22+Math.round(Math.sin(time*5+offset)*2);
    box("#4e3744",x-6,y-4,12,10);
    box("#4e3744",x-4,y-6,8,14);
    box("#c79258",x-4,y-4,8,10);
    box("#ffdc84",x-2,y-7,4,14);
    box("#fff6c7",x-1,y-3,2,6);
  }
  for (const {platform,offset,taken} of level.kits) {
    if (taken) continue;
    const x = platform.x+offset, y = platform.y-15;
    box(s.ink,x-8,y-5,16,14);
    box("#2e6b65",x-7,y-4,14,12);
    cross(x-4,y-3,"#a3f2bc");
  }
  const {door,end} = level;
  const open = collected===3;
  box(s.ink,door-8,end.y-46,39,46);
  box(s.tile,door-6,end.y-44,35,43);
  box(s.top,door-6,end.y-44,35,2);
  box(open?"#29454d":s.low,door-1,end.y-34,25,34);
  for(let i=0;i<3;i++) box(i<collected?"#a3f2bc":"#fb8990",door+3+i*6,end.y-40,4,3);
  if (!open) {
    box(s.light,door+2,end.y-31,8,27);
    box(s.light,door+13,end.y-31,8,27);
  }
  if (stageIndex===2 && open) sprite(door+3,end.y-19,-1,true);
  if (promptTimer) label(`Ще ${3-collected} ◆`,door-17,end.y-45,"#ffe58a");
  const p = player;
  if (!invulnerable || Math.floor(invulnerable*18)%2===0) {
    const pose = !p.ground ? "jump" : down("left")||down("right") ? "run" : "idle";
    sprite(p.x,p.y,p.dir,false,pose);
  }
  for (const spark of particles) box(spark.color,spark.x,spark.y,2,2);
  ctx.restore();
  progress(s);
}

function pause() {
  if (mode==="play") modal("pause","Сигнал на утриманні","Пауза","Краплик готовий рушати далі.","Продовжити",play);
  else if (mode==="pause") play();
}

const shell = $("game-shell");
const fullscreenButton = $("fullscreen");
let fullscreenBusy = false, nativeWasActive = false, orientationLocked = false;

function clearInput() {
  held.clear();
  for (const {button} of touches.values()) button.classList.remove("held");
  touches.clear();
}

function ownsFullscreen() {
  return (document.fullscreenElement || document.webkitFullscreenElement)===shell;
}

function fitFullscreen() {
  if (!shell.classList.contains("immersive")) return;
  const height = ownsFullscreen() ? window.innerHeight : window.visualViewport?.height || window.innerHeight;
  shell.style.setProperty("--viewport-height",Math.round(height)+"px");
  const style = getComputedStyle(shell);
  const padding = parseFloat(style.paddingTop)+parseFloat(style.paddingBottom);
  const readout = document.querySelector(".readout").getBoundingClientRect().height;
  shell.style.setProperty("--screen-height",Math.max(1,shell.clientHeight-padding-readout)+"px");
  if (window.innerHeight>window.innerWidth && mode==="play") pause();
}

function setImmersive(active) {
  shell.classList.toggle("immersive",active);
  document.body.classList.toggle("immersive-active",active);
  fullscreenButton.setAttribute("aria-pressed",String(active));
  fullscreenButton.textContent = active ? "⛶ Згорнути" : "⛶ На весь екран";
  $("pause").hidden = !active;
  clearInput();
  if (!active && orientationLocked) {
    window.screen.orientation?.unlock?.();
    orientationLocked = false;
  }
  requestAnimationFrame(fitFullscreen);
}

function syncFullscreen() {
  const active = ownsFullscreen();
  // Native exit also fires when the phone's system Back or browser exit is used.
  if (active || nativeWasActive) setImmersive(active);
  nativeWasActive = active;
}

async function toggleFullscreen() {
  if (fullscreenBusy) return;
  fullscreenBusy = true;
  fullscreenButton.disabled = true;
  try {
    if (shell.classList.contains("immersive")) {
      if (ownsFullscreen()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) await exit.call(document);
        syncFullscreen();
      } else {
        setImmersive(false);
      }
    } else {
      // The page layout also works in mobile browsers without native fullscreen.
      setImmersive(true);
      const request = shell.requestFullscreen || shell.webkitRequestFullscreen;
      if (request) {
        try { await request.call(shell); } catch { /* Keep the fitted page layout. */ }
      }
      if (ownsFullscreen()) {
        nativeWasActive = true;
        try {
          if (window.screen.orientation?.lock) {
            await window.screen.orientation.lock("landscape");
            orientationLocked = true;
            if (!shell.classList.contains("immersive")) window.screen.orientation.unlock();
          }
        } catch { /* The portrait hint explains how to rotate manually. */ }
      }
      fitFullscreen();
    }
  } catch {
    if (!ownsFullscreen()) setImmersive(false);
  } finally {
    fullscreenBusy = false;
    fullscreenButton.disabled = false;
  }
}

fullscreenButton.onclick = toggleFullscreen;
$("pause").onclick = pause;
document.addEventListener("fullscreenchange",syncFullscreen);
document.addEventListener("webkitfullscreenchange",syncFullscreen);
window.addEventListener("resize",fitFullscreen);
window.visualViewport?.addEventListener("resize",fitFullscreen);
document.addEventListener("visibilitychange",()=>{
  if (document.hidden) {
    clearInput();
    if (mode==="play") pause();
  }
});

window.addEventListener("keydown",event=>{
  if (event.code==="Escape" && !event.repeat) pause();
  const key = keys.get(event.code);
  if (!key || (mode!=="play" && event.target instanceof HTMLButtonElement)) return;
  event.preventDefault();
  if (mode!=="play") {
    if (event.code==="Space"&&!event.repeat) $("action").click();
    return;
  }
  if (key==="jump"&&!event.repeat) jumpBuffer=.12;
  held.add(key);
});
window.addEventListener("keyup",event=>held.delete(keys.get(event.code)));
window.addEventListener("blur",clearInput);
for (const button of document.querySelectorAll("[data-key]")) {
  const key = button.dataset.key;
  button.addEventListener("pointerdown",event=>{
    if (mode!=="play") return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    touches.set(event.pointerId,{key,button});
    button.classList.add("held");
    if (key==="jump") jumpBuffer=.12;
  });
  const release = event=>{
    touches.delete(event.pointerId);
    if (![...touches.values()].some(touch=>touch.button===button)) button.classList.remove("held");
  };
  for (const type of ["pointerup","pointercancel","lostpointercapture"]) button.addEventListener(type,release);
}
$("restart").onclick = newGame;
newGame();
let last = performance.now(), accumulator = 0;
function frame(now) {
  const elapsed = Math.min(.05,(now-last)/1000);
  visualTime += elapsed;
  accumulator += elapsed;
  last = now;
  while (accumulator>=1/120) {
    step(1/120);
    accumulator -= 1/120;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
